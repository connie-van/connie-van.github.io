<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar builder</title>
<style>
/* fonts come from the site's own fonts folder */
@font-face{font-family:'Geist Mono';font-style:normal;font-weight:500;font-display:swap;src:url('fonts/geist-mono-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Noto Star';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/noto-star-2736.woff2') format('woff2');unicode-range:U+2736}

:root{--ink:#14110F;--mute:#6B645C;--faint:#96908A;--paper:#FBF7F0;
  --body:#9E9C91;--eyes:#000000;--hair:#BB9250;
  --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--mono);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;border-radius:0;text-align:center}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.label{font:500 10.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase}

/* ---------- the three panels ---------- */
.app{height:100%;display:grid;grid-template-columns:1fr .9fr 1fr;border:1px solid var(--ink)}
.panel{display:flex;flex-direction:column;min-width:0;min-height:0}
.panel.left{border-right:1px solid var(--ink)}
.panel.right{border-left:1px solid var(--ink)}

.tabs{display:flex;flex:none;height:33px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;border-left:1px solid var(--ink);border-bottom:1px solid var(--ink);white-space:nowrap;font:500 10.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.tab:first-child{border-left:0}
.tab:hover{color:var(--mute)}
.tab[aria-selected="true"]{border-bottom-color:var(--paper);background:var(--paper);color:var(--ink)}
.tab[aria-selected="true"]::before{content:"\2736";font-family:'Noto Star',sans-serif;font-size:12px;line-height:1}

.body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:24px 5%;scrollbar-width:thin;scrollbar-color:var(--faint) transparent}
.body.colors{padding:24px}

/* ---------- trait tiles ---------- */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:10px;row-gap:10px;align-items:start}
.tile{position:relative;display:block;width:100%;aspect-ratio:1;border:1px solid var(--ink)}
/* an outfit with no background (the Snoo) keeps a thin frame like the trait tiles, so it doesn't float */
.tile.bg.nobg{border:1px solid var(--ink)}
/* section dividers in the menus (SECTIONS in avatar-traits.js): a label and a line across the full width of the grid */
.sec{grid-column:1/-1;display:flex;align-items:center;gap:14px;margin:18px 0 2px;font:500 10.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.sec.first{margin-top:0}
.sec::after{content:"";flex:1;height:1px;background:var(--ink)}
.tile:hover{box-shadow:inset 0 0 0 1px rgba(20,17,15,.4)}
.tile.on,.tile.on:hover{box-shadow:inset 0 0 0 1px var(--ink)}
.tile.on::after{content:"\2736";position:absolute;top:4px;right:6px;font:400 13px/1 'Noto Star',sans-serif;color:var(--ink)}
.thumb{position:absolute;inset:12px}
.thumb.iso{display:grid;place-items:center}
.view{position:relative;overflow:hidden}
.tile.none{display:grid;place-items:center}
.tile.none .nlabel{font:500 10.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.tile.none.on .nlabel{color:var(--ink)}
/* background images show at their own size, free of the square */
.tile.bg{aspect-ratio:3/4;border:0}
.tile.bg .thumb{inset:0}
.tile.bg:hover{box-shadow:none;outline:1px solid rgba(20,17,15,.4)}
/* collectible Outfits tiles: the holographic hover (HOLO in avatar-traits.js). The tile itself stays still; two layers sit over the artwork,
   both printed through the same pixel halftone (square dots that grow from tiny to nearly solid; the pattern is made once in
   avatar-builder.js as --holo-mask), and both slide with the cursor:
   .holo  = the Venusaur-ex-style foil: chunky rainbow stripes crossed by wide silver bands;
   .shine = one soft rainbow band, about a third of the card wide, moving through the squares with the foil.
   They are invisible until the tile is hovered (.hov), so tiles that aren't hovered cost nothing. */
/* collectible Outfits tiles also get the main display's rounded corners (AVATAR_CORNER); every other tile stays square */
.tile.collect,.tile.collect .thumb,.tile.collect .holo,.tile.collect .shine{border-radius:calc(var(--corner,0) * 100%) / calc(var(--corner,0) * 75%)}
.tile.collect .thumb{overflow:hidden}
/* the slight tilt and lift on hover (HOLO.tilt / HOLO.lift): eases in and settles back gently */
.tile.collect{transition:transform .3s ease-out}
.tile.collect.hov{z-index:3;transition:transform .15s ease-out}
.tile.collect.on::after{top:7px;right:9px;z-index:4}
.tile.collect .holo,.tile.collect .shine{position:absolute;inset:0;pointer-events:none;z-index:2;opacity:0;transition:opacity .3s;
  -webkit-mask-image:var(--holo-mask,none);mask-image:var(--holo-mask,none);-webkit-mask-size:100% 100%;mask-size:100% 100%}
.tile.collect .holo{
  background-image:
    repeating-linear-gradient(0deg,#ff7a8a 0%,#ffe36e 4%,#a6ff7a 8%,#78f2ff 12%,#8aa2ff 16%,#d48aff 20%,#ff7a8a 24%),
    repeating-linear-gradient(128deg,#101528 0%,#93a3a6 2.5%,#cfe0e0 3.2%,#93a3a6 3.9%,#101528 6.5%,#101528 9%);
  background-size:100% 1100%,1400% 1400%;
  background-position:var(--bx,50%) var(--by,50%),var(--bx,50%) var(--by,50%);
  background-blend-mode:hue;
  mix-blend-mode:color-dodge;
  filter:brightness(.8) contrast(1.35) saturate(1.35)}
.tile.collect .shine{
  background-image:linear-gradient(128deg,transparent 0%,transparent 41%,rgba(255,130,210,.85) 45.5%,rgba(255,236,140,.95) 48%,rgba(150,255,200,.95) 50%,rgba(130,210,255,.95) 52%,rgba(190,150,255,.85) 54.5%,transparent 59%,transparent 100%);
  background-size:300% 300%;background-repeat:no-repeat;background-position:var(--shx,50%) var(--shy,50%);
  mix-blend-mode:screen}
.tile.collect.hov .holo{opacity:var(--holo-i,.5)}
.tile.collect.hov .shine{opacity:calc(var(--holo-i,.5) * 1.4)}
.tile.bg.on,.tile.bg.on:hover{box-shadow:none;outline:2px solid var(--ink)}
.tile.bg.none{border:1px solid var(--ink)}
.tile.bg.none.on,.tile.bg.none.on:hover{outline:0;box-shadow:inset 0 0 0 1px var(--ink)}
.tile.bg.on::after{top:5px;right:6px}
.tile.bg.none.on::after{top:4px}
/* the selected star has no backing: dark on light tiles, paper-colored (.lt) where the tile's top-right corner is dark.
   Which one is worked out from the artwork when the builder loads (see starTones in avatar-builder.js) */
.tile.on.lt::after{color:var(--paper)}
.empty{font:500 10.5px/1.6 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.empty .star{font-family:'Noto Star',sans-serif;font-size:13px;color:var(--ink);margin-right:6px}

/* tiles marked originalInMenu show their set's original colors until the visitor picks a color of their own (the c-* classes are set on <html>) */
html:not(.c-body) .tile.og-body{--body:var(--og-body)}
html:not(.c-eyes) .tile.og-eyes{--eyes:var(--og-eyes)}
html:not(.c-hair) .tile.og-hair{--hair:var(--og-hair)}

/* ---------- the avatar ---------- */
.stage{position:relative;display:flex;align-items:center;justify-content:center;padding:25px 16px;min-width:0;min-height:0;container-type:size}
/* always 3:4, as big as fits: the character lines up with the background art only at this shape */
.card{position:relative;flex:none;width:min(100cqw,75cqh);aspect-ratio:3/4}
/* the main display only: when a background is on, its corners are round (the picker tiles in the B.G. tab stay square). The size is AVATAR_CORNER in avatar-traits.js,
   as a fraction of the card's width; the two values make the corners circular on a 3:4 card */
.card.rounded{overflow:hidden;border-radius:calc(var(--corner,0) * 100%) / calc(var(--corner,0) * 75%)}
.avatar{position:absolute;inset:0}
.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-select:none;user-select:none}
.layer.cover{object-fit:cover}
/* main display and Outfits tiles: the character's layers sit in a smaller box on the background (FIGURE in avatar-traits.js); the background stays full size */
#card .layer:not(.cover),.tile.fit .layer:not(.cover){inset:auto;left:var(--fig-l,0);top:var(--fig-t,0);width:var(--fig-w,100%);height:var(--fig-h,100%)}
.layer.tint{-webkit-mask-image:var(--m);mask-image:var(--m);-webkit-mask-size:contain;mask-size:contain;-webkit-mask-position:center;mask-position:center;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.layer.tint.cover{-webkit-mask-size:cover;mask-size:cover}
.actions{position:absolute;left:0;right:0;bottom:0;height:25px;display:flex;align-items:center;justify-content:center;gap:12px;font:500 10.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.actions button{font:inherit;letter-spacing:inherit;text-transform:inherit}
.actions button:hover{text-decoration:underline;text-underline-offset:3px}
.actions span{color:var(--mute)}

/* ---------- colors ----------
   One column: what you're coloring, (background modes), the picker, the hex row, the palette.
   The palette is pinned to the bottom and any spare height becomes equal gaps between the sections. */
.body.colors{padding:28px 24px;display:flex;flex-direction:column}
.cwrap{flex:1 0 auto;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.targets{display:flex}
.tg{flex:1 1 0;display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border:1px solid var(--ink);margin-left:-1px;white-space:nowrap;font:500 10.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.tg:first-child{margin-left:0}
.tg .chip{width:12px;height:12px;border:1px solid var(--ink);flex:none;background-size:cover;background-position:center}
.tg.on{background:var(--ink);color:var(--paper)}
.tg.on .chip{border-color:var(--paper)}
.tg.idle{border-color:var(--faint);color:var(--mute)}
.tg.idle .chip{border-color:var(--faint)}
.tg.idle.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
/* None / Solid / Gradient: plain words (underline) or a small square (square). Switch in avatar-traits.js (MODE_STYLE) */
.modes{display:flex;gap:32px}
.mode{display:flex;align-items:center;gap:8px;padding:0 0 5px;font:500 10.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);border-bottom:2px solid transparent}
.mode:hover{color:var(--ink)}
.modes.ul .mode.on{color:var(--ink);border-bottom-color:var(--ink)}
.modes.sq .mode{padding-bottom:0}
.modes.sq .mode::before{content:"";width:12px;height:12px;border:1px solid var(--ink);flex:none}
.modes.sq .mode.on{color:var(--ink)}
.modes.sq .mode.on::before{background:var(--ink)}
/* the picker: one rectangle (saturation across, brightness down) and a hue strip */
.picker.dim{opacity:.35;pointer-events:none}
.sv{position:relative;height:160px;border:1px solid var(--ink);touch-action:none;cursor:crosshair;
  background-color:hsl(var(--h,0),100%,50%);
  background-image:linear-gradient(to top,#000,rgba(0,0,0,0)),linear-gradient(to right,#fff,rgba(255,255,255,0))}
.handle{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:2px solid var(--ink);background:var(--hc,#fff);box-shadow:inset 0 0 0 2px var(--paper);pointer-events:none}
.hue{position:relative;height:14px;margin-top:12px;border:1px solid var(--ink);touch-action:none;cursor:pointer;
  background:linear-gradient(to right,#f00 0%,#ff0 16.667%,#0f0 33.333%,#0ff 50%,#00f 66.667%,#f0f 83.333%,#f00 100%)}
.knob{position:absolute;top:-6px;width:10px;height:24px;margin-left:-5px;border:1px solid var(--ink);background:var(--paper);pointer-events:none}
/* one quiet row: the color as a square (two for a gradient), then the hex */
.hexrow{display:flex;align-items:center;gap:12px;min-height:36px}
.swatch{display:block;width:28px;height:28px;flex:none;border:1px solid var(--ink);background-size:cover;background-position:center;padding:0}
.stop.on{box-shadow:0 0 0 3px var(--paper),0 0 0 4px var(--ink)}
.hex{display:flex;align-items:baseline;gap:2px;margin-left:8px;padding:0 4px 3px 0;border-bottom:1px solid var(--ink)}
.hex.bad,.hex:focus-within{border-bottom-width:2px;padding-bottom:2px}
.hex .hash{color:var(--mute);font:500 15px/1 var(--mono)}
.hex input{width:7.5ch;border:0;background:none;outline:0;padding:0;font:500 15px/1 var(--mono);color:var(--ink);text-transform:uppercase;letter-spacing:0}
.dropper{display:grid;place-items:center;width:28px;height:28px;flex:none;border:1px solid var(--ink);color:var(--ink)}
.dropper:hover{background:var(--ink);color:var(--paper)}
/* ?tune panel (tuning only, never shown to visitors) */
#tune{position:fixed;right:16px;bottom:16px;z-index:10000;isolation:isolate;width:280px;background:var(--paper);border:1px solid var(--ink);padding:10px 12px;font:500 10.5px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase}
#tune .th{display:flex;justify-content:space-between;align-items:center}
#tune .th button{width:20px;height:20px;border:1px solid var(--ink);line-height:1}
#tune .tbody{margin-top:8px}
#tune.min .tbody{display:none}
#tune .tr{display:grid;grid-template-columns:92px 1fr 40px;align-items:center;gap:8px;margin:7px 0}
#tune .tr input{width:100%;accent-color:var(--ink)}
#tune .tr output{text-align:right}
#tune select{font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--ink);padding:2px 4px}
#tune code{display:block;margin-top:10px;padding-top:8px;border-top:1px solid var(--ink);font:500 10px/1.5 var(--mono);letter-spacing:0;text-transform:none;word-break:break-word}
#tune .tb{display:flex;gap:6px;margin-top:8px}
#tune .tb button{border:1px solid var(--ink);padding:4px 10px}
#tune .tb button:hover,#tune .th button:hover{background:var(--ink);color:var(--paper)}
#tune .tn{margin-top:8px;color:var(--mute);letter-spacing:0;text-transform:none}
/* palette: 12 presets, then 12 slots for your own colors */
.palette{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px}
.pal{position:relative;aspect-ratio:1}
.pal .use{display:block;width:100%;height:100%;border:1px solid var(--ink)}
.pal.on .use{outline:1px solid var(--ink);outline-offset:2px}
.pal.slot .use{border:1px dashed var(--faint);color:var(--mute);font:500 14px/1 var(--mono)}
.pal .x{display:none;position:absolute;top:-6px;right:-6px;width:14px;height:14px;background:var(--ink);color:var(--paper);font:500 10px/14px var(--mono)}
.pal.saved:hover .x,.pal.saved:focus-within .x{display:block}
@media (hover:none){.pal.saved .x{display:block}}

/* ---------- narrow screens: stack the three panels ---------- */
@media (max-width:860px){
  body{overflow:auto}
  .app{height:auto;grid-template-columns:1fr}
  .panel.left{border-right:0;border-bottom:1px solid var(--ink);order:2;height:330px}
  .panel.right{border-left:0;order:3;height:330px}
  .stage{order:1;height:470px;border-bottom:1px solid var(--ink)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <section class="panel left">
    <div class="tabs" id="tabs-left" role="tablist" aria-label="Body"></div>
    <div class="body" id="body-left" role="tabpanel"></div>
  </section>
  <section class="stage">
    <div class="card" id="card" role="img" aria-label="Your avatar"></div>
    <div class="actions"><button id="shuffle" type="button">Shuffle</button><span>/</span><button id="resetAll" type="button">Reset all</button></div>
  </section>
  <section class="panel right">
    <div class="tabs" id="tabs-right" role="tablist" aria-label="Accessories, background and colors"></div>
    <div class="body" id="body-right" role="tabpanel"></div>
  </section>
</div>
<script src="avatar-traits.js"></script>
<script src="avatar-builder.js"></script>
</body>
</html>
