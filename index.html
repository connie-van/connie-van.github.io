<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar builder</title>
<style>
/* fonts come from the site's own fonts folder */
@font-face{font-family:'Geist Mono';font-style:normal;font-weight:500;font-display:swap;src:url('../fonts/geist-mono-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Cossette Titre';font-style:normal;font-weight:700;font-display:swap;src:url('../fonts/cossette-titre-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'Noto Star';font-style:normal;font-weight:400;font-display:swap;src:url('../fonts/noto-star-2736.woff2') format('woff2');unicode-range:U+2736}

:root{--ink:#14110F;--mute:#6B645C;--paper:#FBF7F0;--r:20px;
  --body:#9E9C91;--eyes:#161616;--hair:#BB9250;
  --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--mono);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* squeezed headings, same trick as the main site: laid out wider, squeezed back, corners rounded by the filter */
.sqw{--sq:.68;display:block}
.sqw>span{display:block;width:calc(100%/var(--sq));transform:scaleX(var(--sq));transform-origin:0 0;font-family:'Cossette Titre','Arial Narrow',Impact,sans-serif;font-weight:700}

.app{height:100%;display:grid;grid-template-columns:minmax(220px,32%) minmax(0,1fr);gap:28px;padding:24px 28px}
.left{display:flex;flex-direction:column;align-items:center;gap:16px;min-width:0;min-height:0}
.card{position:relative;width:min(100%,calc((100vh - 48px - 76px) * .75));aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;background:#FFF1D6}
.actions{display:flex;gap:10px}
.actions button,.reset{appearance:none;border:2px solid var(--ink);border-radius:999px;padding:11px 18px;font:500 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;background:var(--ink);color:var(--paper)}
.actions button:hover{background:#2e2924}
.actions button.ghost,.reset{background:transparent;color:var(--ink)}
.actions button.ghost:hover,.reset:hover{background:rgba(20,17,15,.08)}

.right{display:flex;flex-direction:column;min-width:0;min-height:0}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;padding:12px 10px;font:500 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;cursor:pointer;color:var(--mute)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
.tab[aria-selected="true"]::before{content:"\2736";font-family:'Noto Star',sans-serif;font-size:14px;margin-right:6px;vertical-align:-1px;text-decoration:none;display:inline-block}

.head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:10px 2px 16px}
.head .sqw{flex:1 1 auto;min-width:0;font-size:68px;line-height:1;filter:url(#round-l)}
.count{font:500 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);white-space:nowrap}

.panel{flex:1;min-height:0;overflow:auto;padding:4px 4px 24px;scrollbar-width:thin;scrollbar-color:rgba(20,17,15,.3) transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:14px}
.tile{appearance:none;position:relative;aspect-ratio:1;border:0;border-radius:var(--r);background:var(--tc);padding:16px;display:grid;place-items:center;overflow:hidden;cursor:pointer}
.tile:hover{box-shadow:inset 0 0 0 2px rgba(20,17,15,.4)}
.tile.on,.tile.on:hover{box-shadow:inset 0 0 0 3px var(--ink)}
.tile.on::after{content:"\2736";position:absolute;top:8px;right:11px;font:400 20px/1 'Noto Star',sans-serif;color:var(--ink)}
.tile.none{background:transparent;box-shadow:inset 0 0 0 2px rgba(20,17,15,.28)}
.tile.none.on{box-shadow:inset 0 0 0 3px var(--ink)}
.thumb{position:absolute;inset:16px}
.thumb.iso{display:grid;place-items:center}
.view{position:relative;overflow:hidden}
.tile.bgtile{padding:0}
.tile.bgtile .thumb{inset:0}
.nlabel{font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.empty{margin:36px 4px;font:500 13px/1.5 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.card .empty{margin:24px 20px}
.empty .star{font-family:'Noto Star',sans-serif;font-size:18px;margin-right:6px;color:var(--ink)}

.avatar{position:absolute;inset:0}
.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-select:none;user-select:none}
.layer.cover{object-fit:cover}
.layer.tint{-webkit-mask-image:var(--m);mask-image:var(--m);-webkit-mask-size:contain;mask-size:contain;-webkit-mask-position:center;mask-position:center;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.layer.tint.cover{-webkit-mask-size:cover;mask-size:cover}

.cg{margin:0 0 26px}
.cgh{display:flex;align-items:center;gap:16px;margin:0 0 12px}
.cgh .sqw{flex:0 0 190px;font-size:36px;line-height:1;filter:url(#round-s)}
.note{font:500 11px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.cg.idle .sw-row{opacity:.5}
.sw-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.sw{appearance:none;position:relative;width:44px;height:44px;flex:none;border-radius:50%;border:2px solid var(--ink);padding:0;cursor:pointer}
.sw.on{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--ink)}
.sw.custom{background:conic-gradient(#ff3b3b,#ffe53b,#3bff6a,#3bf5ff,#3b5bff,#d63bff,#ff3b3b);display:grid;place-items:center;overflow:hidden}
.sw.custom svg{width:26px;height:26px;pointer-events:none;transform:rotate(8deg)}
.sw.custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}

@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);gap:12px;padding:14px}
  .card{width:min(100%,calc(100vh * .34 * .75))}
  .head .sqw{font-size:48px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
  .tab{padding:11px 8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="round-s" x="-5%" y="-25%" width="110%" height="150%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceGraphic" stdDeviation=".7"/><feComponentTransfer><feFuncA type="linear" slope="4.5" intercept="-1.75"/></feComponentTransfer></filter>
  <filter id="round-l" x="-5%" y="-25%" width="110%" height="150%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceGraphic" stdDeviation="2"/><feComponentTransfer><feFuncA type="linear" slope="4.5" intercept="-1.75"/></feComponentTransfer></filter>
</svg>
<div class="app">
  <section class="left">
    <div class="card" id="card" role="img" aria-label="Your avatar"></div>
    <div class="actions">
      <button id="shuffle" type="button">Shuffle</button>
      <button id="resetAll" type="button" class="ghost">Reset all</button>
    </div>
  </section>
  <section class="right">
    <div class="tabs" id="tabs" role="tablist" aria-label="Avatar traits"></div>
    <div class="head"><h2 class="sqw"><span id="title"></span></h2><span class="count" id="count"></span></div>
    <div class="panel" id="panel" role="tabpanel"></div>
  </section>
</div>
<script src="traits.js"></script>
<script src="builder.js"></script>
</body>
</html>
